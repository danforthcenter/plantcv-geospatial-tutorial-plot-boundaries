name: test-pr

on:
  push:
    branches: [ main ]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [ main ]
  schedule:
    - cron: "0 0 1 * *"

jobs:
    build:
        runs-on: ${{ matrix.os }}
        strategy:
          matrix:
            python-version: ["3.11"]
            os: [ubuntu-latest]
        env:
          OS: ${{ matrix.os }}
          PYTHON: ${{ matrix.python-version }}

        steps:
        - uses: actions/checkout@main
        - name: Set up Python ${{ matrix.python-version }}
          uses: actions/setup-python@main
          with:
              python-version: ${{ matrix.python-version }}
        - name: Install dependencies
          run: |
            python -m pip install --upgrade pip
            pip install pytest jupyter nbconvert
            pip install -r requirements.txt
        # The notebook opens real Napari/Qt viewers, which need a display to construct even
        # when nothing is actually drawn on screen. This sets up a virtual display (Xvfb) plus
        # the system libraries Qt needs, so napari.Viewer() works on GitHub's headless runners.
        - name: Set up virtual display for Napari/Qt
          uses: pyvista/setup-headless-display-action@v3
          with:
            qt: true
        - name: "Build notebooks"
          run: |
            pytest -v tests/tests.py
